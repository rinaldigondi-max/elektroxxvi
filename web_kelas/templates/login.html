<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - Portal Elektro</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 350px; }
        h2 { text-align: center; color: #1e293b; margin-bottom: 25px; }
        label { font-size: 13px; font-weight: bold; color: #64748b; }
        input { width: 100%; padding: 12px; margin: 8px 0 20px 0; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        .error { color: #ef4444; background: #fef2f2; padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; margin-bottom: 15px; }
        .hint { font-size: 11px; color: #64748b; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Portal Mahasiswa Elektro</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for msg in messages %}
              <div class="error">{{ msg }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form action="/login" method="POST">
            <label>Masukkan NPM Anda:</label>
            <input type="text" name="npm" placeholder="Contoh: 21001" required autofocus>
            <button type="submit">Masuk Sistem</button>
        </form>
        <p class="hint">NPM Uji Coba: 21001 (Budi) atau 99999 (Admin)</p>
    </div>
</body>
</html>
